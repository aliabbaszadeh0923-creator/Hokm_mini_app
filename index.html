<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0,user-scalable=no">

  <title>HOKM</title>

  <!-- Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #4b185b 0%, #180d20 45%, #08060b 100%);
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .coins {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.08);
      padding: 10px 15px;
      border-radius: 25px;
    }

    .player {
      text-align: center;
    }

    .avatar {
      width: 52px;
      height: 52px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg,#ff28d7,#7e32ff);
      font-size: 25px;
    }

    .player-name {
      margin-top: 5px;
      font-size: 14px;
    }

    .logo {
      text-align: center;
      margin-top: 55px;
      margin-bottom: 35px;
    }

    .logo h1 {
      margin: 0;
      font-size: 58px;
      letter-spacing: 6px;
      color: #e747ff;
      text-shadow: 0 0 25px rgba(231,71,255,.4);
    }

    .logo p {
      color: #aaa;
      margin-top: 8px;
    }

    .card {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 28px;
      padding: 28px 20px;
      text-align: center;
      backdrop-filter: blur(15px);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 10px 0;
    }

    .description {
      color: #aaa;
      line-height: 1.7;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 20px;
      padding: 17px;
      margin-top: 14px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      background: linear-gradient(135deg,#ff27d1,#8534ff);
      cursor: pointer;
    }

    button.secondary {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);
    }

    input {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.15);
      outline: none;
      background: rgba(0,0,0,.25);
      color: white;
      font-size: 20px;
      text-align: center;
      letter-spacing: 4px;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 20px;
      padding: 16px;
      border-radius: 17px;
      background: rgba(255,255,255,.07);
      line-height: 1.8;
    }

    .room-code {
      font-size: 35px;
      font-weight: bold;
      letter-spacing: 8px;
      margin: 20px 0;
      padding: 18px;
      border-radius: 20px;
      background: rgba(255,255,255,.08);
    }

    .players {
      margin-top: 20px;
      text-align: right;
    }

    .player-slot {
      padding: 14px;
      margin-top: 8px;
      border-radius: 15px;
      background: rgba(255,255,255,.06);
    }

    .footer {
      text-align: center;
      color: #666;
      margin-top: 30px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">

    <div class="coins">
      🪙 <span id="coins">0</span>
    </div>

    <div class="player">
      <div class="avatar">♠</div>
      <div class="player-name" id="username">
        Player
      </div>
    </div>

  </div>


  <div class="logo">
    <h1>HOKM</h1>
    <p>Ultimate Card Game</p>
  </div>


  <!-- HOME -->

  <div class="card" id="home">

    <div class="icon">🃏</div>

    <h2>آماده‌ای؟</h2>

    <p class="description">
      وارد بازی حکم شو و با دوستانت بازی کن.
    </p>

    <button onclick="startGame()">
      🎮 شروع بازی
    </button>

    <button class="secondary" onclick="createRoom()">
      👥 ساخت روم
    </button>

    <button class="secondary" onclick="showJoin()">
      🔗 ورود به روم
    </button>

  </div>


  <!-- JOIN -->

  <div class="card hidden" id="joinPage">

    <div class="icon">🔗</div>

    <h2>ورود به روم</h2>

    <p class="description">
      کد ۶ رقمی روم را وارد کن.
    </p>

    <input
      id="joinCode"
      maxlength="6"
      inputmode="numeric"
      placeholder="123456">

    <button onclick="joinRoom()">
      🚪 ورود به روم
    </button>

    <button class="secondary" onclick="goHome()">
      ↩️ برگشت
    </button>

    <div id="joinMessage"></div>

  </div>


  <!-- ROOM -->

  <div class="card hidden" id="roomPage">

    <div class="icon">🃏</div>

    <h2>روم بازی</h2>

    <p class="description">
      کد روم را برای دوستانت بفرست.
    </p>

    <div class="room-code" id="roomCode">
      ------
    </div>

    <button onclick="copyRoomCode()">
      📋 کپی کد روم
    </button>

    <button class="secondary" onclick="shareRoom()">
      📤 دعوت دوستان
    </button>

    <div class="players">

      <h3>بازیکنان</h3>

      <div id="playersList">
        در حال دریافت بازیکنان...
      </div>

    </div>

    <button class="secondary" onclick="goHome()">
      ↩️ خروج
    </button>

  </div>


  <div class="footer">
    HOKM • Telegram Mini App
  </div>

</div>


<script>

  /* ==========================================
     SUPABASE CONFIG
     ========================================== */

  /*
    فقط این دو مقدار را وارد کن.
  */

  const SUPABASE_URL =
    "https://uhgikijqlirttwdykaah.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_jgq1e7NvxiANV8pEyTYKlA_ZobviYyi";


  /* ==========================================
     SUPABASE CLIENT
     ========================================== */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     TELEGRAM
     ========================================== */

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  const telegramUser =
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
      ? tg.initDataUnsafe.user
      : null;


  const telegramId =
    telegramUser && telegramUser.id
      ? String(telegramUser.id)
      : "guest-" + Date.now();


  const username =
    telegramUser && telegramUser.first_name
      ? telegramUser.first_name
      : "Player";


  document.getElementById("username").textContent =
    username;


  /* ==========================================
     VARIABLES
     ========================================== */

  let currentRoom = null;
  let currentRoomId = null;
  let realtimeChannel = null;


  /* ==========================================
     UI
     ========================================== */

  function hideAllPages() {

    document.getElementById("home")
      .classList.add("hidden");

    document.getElementById("joinPage")
      .classList.add("hidden");

    document.getElementById("roomPage")
      .classList.add("hidden");
  }


  function goHome() {

    hideAllPages();

    document.getElementById("home")
      .classList.remove("hidden");

    if (realtimeChannel) {

      supabaseClient
        .removeChannel(realtimeChannel);

      realtimeChannel = null;
    }
  }


  function startGame() {

    alert(
      "🎮 سیستم بازی آماده می‌شود.\n\n" +
      "اول یک روم بساز یا وارد روم دوستت شو."
    );
  }


  function showJoin() {

    hideAllPages();

    document.getElementById("joinPage")
      .classList.remove("hidden");

    document.getElementById("joinCode")
      .focus();
  }


  function showError(elementId, message) {

    document.getElementById(elementId).innerHTML =
      `<div class="message">❌ ${message}</div>`;
  }


  /* ==========================================
     CREATE ROOM
     ========================================== */

  async function createRoom() {

    try {

      const code =
        Math.floor(
          100000 +
          Math.random() * 900000
        ).toString();


      const { data: room, error } =
        await supabaseClient
          .from("rooms")
          .insert({
            code: code,
            status: "waiting"
          })
          .select()
          .single();


      if (error) {

        console.error(error);

        alert(
          "❌ خطا در ساخت روم:\n\n" +
          error.message
        );

        return;
      }


      currentRoom = code;
      currentRoomId = room.id;


      /*
        جدول room_players ما از قبل
        با room_id ساخته شده.
      */

      const { error: playerError } =
        await supabaseClient
          .from("room_players")
          .insert({
            room_id: room.id,
            telegram_id: telegramId,
            username: username,
            seat: 1,
            ready: true
          });


      if (playerError) {

        console.error(playerError);

        alert(
          "❌ روم ساخته شد اما بازیکن اضافه نشد:\n\n" +
          playerError.message
        );

        return;
      }


      showRoom();

      await loadPlayers();

      listenToRoom();


    } catch (error) {

      console.error(error);

      alert(
        "❌ خطا در اتصال به سرور:\n\n" +
        error.message
      );
    }
  }


  /* ==========================================
     SHOW ROOM
     ========================================== */

  function showRoom() {

    hideAllPages();

    document.getElementById("roomPage")
      .classList.remove("hidden");

    document.getElementById("roomCode")
      .textContent = currentRoom;
  }


  /* ==========================================
     JOIN ROOM
     ========================================== */

  async function joinRoom() {

    const input =
      document.getElementById("joinCode");

    const code =
      input.value.trim();


    if (!/^\d{6}$/.test(code)) {

      showError(
        "joinMessage",
        "کد روم باید ۶ رقمی باشد."
      );

      return;
    }


    try {

      const { data: room, error } =
        await supabaseClient
          .from("rooms")
          .select("*")
          .eq("code", code)
          .maybeSingle();


      if (error) {

        console.error(error);

        showError(
          "joinMessage",
          error.message
        );

        return;
      }


      if (!room) {

        showError(
          "joinMessage",
          "این روم وجود ندارد."
        );

        return;
      }


      const { data: players, error: playersError } =
        await supabaseClient
          .from("room_players")
          .select("*")
          .eq("room_id", room.id);


      if (playersError) {

        showError(
          "joinMessage",
          playersError.message
        );

        return;
      }


      if (players.length >= 4) {

        showError(
          "joinMessage",
          "این روم پر است."
        );

        return;
      }


      /*
        اگر بازیکن قبلاً داخل روم است،
        دوباره اضافه‌اش نمی‌کنیم.
      */

      const alreadyJoined =
        players.some(
          p =>
            String(p.telegram_id) ===
            String(telegramId)
        );


      if (!alreadyJoined) {

        const usedSeats =
          players.map(p => p.seat);

        let seat = 1;

        while (usedSeats.includes(seat)) {
          seat++;
        }


        const { error: insertError } =
          await supabaseClient
            .from("room_players")
            .insert({
              room_id: room.id,
              telegram_id: telegramId,
              username: username,
              seat: seat,
              ready: false
            });


        if (insertError) {

          showError(
            "joinMessage",
            insertError.message
          );

          return;
        }
      }


      currentRoom = code;
      currentRoomId = room.id;


      showRoom();

      await loadPlayers();

      listenToRoom();


    } catch (error) {

      console.error(error);

      showError(
        "joinMessage",
        "اتصال به سرور برقرار نشد."
      );
    }
  }


  /* ==========================================
     LOAD PLAYERS
     ========================================== */

  async function loadPlayers() {

    if (!currentRoomId) return;


    const { data, error } =
      await supabaseClient
        .from("room_players")
        .select("*")
        .eq("room_id", currentRoomId)
        .order("seat");


    if (error) {

      console.error(error);

      document.getElementById("playersList")
        .innerHTML =
        "❌ خطا در دریافت بازیکنان";

      return;
    }


    let html = "";


    for (let seat = 1; seat <= 4; seat++) {

      const player =
        data.find(p => p.seat === seat);


      if (player) {

        const ready =
          player.ready
            ? "🟢 آماده"
            : "🟡 منتظر";


        html += `
          <div class="player-slot">
            👤 ${escapeHtml(player.username || "Player")}
            <span style="float:left">
              ${ready}
            </span>
          </div>
        `;

      } else {

        html += `
          <div class="player-slot">
            ⭕ جایگاه ${seat}
            <span style="float:left;color:#777">
              خالی
            </span>
          </div>
        `;
      }
    }


    document.getElementById("playersList")
      .innerHTML = html;
  }


  /* ==========================================
     REALTIME
     ========================================== */

  function listenToRoom() {

    if (!currentRoomId) return;


    if (realtimeChannel) {

      supabaseClient
        .removeChannel(realtimeChannel);
    }


    realtimeChannel =
      supabaseClient
        .channel(
          "room-" + currentRoomId
        )
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "room_players",
            filter:
              "room_id=eq." +
              currentRoomId
          },
          function () {

            loadPlayers();

          }
        )
        .subscribe();
  }


  /* ==========================================
     COPY ROOM
     ========================================== */

  async function copyRoomCode() {

    try {

      await navigator.clipboard
        .writeText(currentRoom);

      alert(
        "✅ کد روم کپی شد:\n" +
        currentRoom
      );

    } catch {

      alert(
        "کد روم:\n" +
        currentRoom
      );
    }
  }


  /* ==========================================
     SHARE ROOM
     ========================================== */

  function shareRoom() {

    const text =
      "🎮 بیا با من حکم بازی کن!\n\n" +
      "🃏 کد روم: " +
      currentRoom;


    const url =
      "https://t.me/share/url?url=" +
      encodeURIComponent(
        "https://aliabbaszadeh0923-creator.github.io/Hokm_mini_app/"
      ) +
      "&text=" +
      encodeURIComponent(text);


    if (tg.openTelegramLink) {

      tg.openTelegramLink(url);

    } else {

      window.open(
        url,
        "_blank"
      );
    }
  }


  /* ==========================================
     HTML SECURITY
     ========================================== */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

</script>

</body>
    </html>
