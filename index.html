<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>HOKM</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
color:white;
background:linear-gradient(135deg,#43134f,#170b20,#080609);
}

.app{
max-width:520px;
min-height:100vh;
margin:auto;
padding:20px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
}

.coins{
background:rgba(255,255,255,.08);
padding:10px 16px;
border-radius:25px;
}

.player{
text-align:center;
}

.avatar{
width:52px;
height:52px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-size:25px;
background:linear-gradient(135deg,#ff28d7,#7d35ff);
}

.logo{
text-align:center;
margin:55px 0 35px;
}

.logo h1{
margin:0;
font-size:58px;
letter-spacing:6px;
color:#e747ff;
}

.logo p{
color:#aaa;
}

.card{
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.1);
border-radius:28px;
padding:28px 20px;
text-align:center;
}

.icon{
font-size:60px;
}

button{
width:100%;
padding:17px;
margin-top:14px;
border:0;
border-radius:20px;
font-size:17px;
font-weight:bold;
color:white;
background:linear-gradient(135deg,#ff27d1,#8534ff);
}

button.secondary{
background:rgba(255,255,255,.08);
}

input{
width:100%;
padding:16px;
margin-top:15px;
border-radius:15px;
border:1px solid #555;
background:#151018;
color:white;
font-size:20px;
text-align:center;
}

.hidden{
display:none;
}

.message{
margin-top:20px;
padding:16px;
border-radius:15px;
background:rgba(255,255,255,.08);
line-height:1.8;
}

.room-code{
font-size:36px;
font-weight:bold;
letter-spacing:8px;
padding:20px;
margin:20px 0;
border-radius:20px;
background:rgba(255,255,255,.08);
}

.player-slot{
padding:15px;
margin-top:8px;
border-radius:15px;
background:rgba(255,255,255,.06);
text-align:right;
}
</style>
</head>

<body>

<div class="app">

<div class="top">

<div class="coins">
🪙 0
</div>

<div class="player">
<div class="avatar">♠</div>
<div id="username">Player</div>
</div>

</div>

<div class="logo">
<h1>HOKM</h1>
<p>Ultimate Card Game</p>
</div>


<!-- HOME -->

<div class="card" id="home">

<div class="icon">🃏</div>

<h2>آماده‌ای؟</h2>

<p>
وارد بازی حکم شو و با دوستانت بازی کن.
</p>

<button onclick="createRoom()">
👥 ساخت روم
</button>

<button class="secondary" onclick="showJoin()">
🔗 ورود به روم
</button>

</div>


<!-- JOIN -->

<div class="card hidden" id="join">

<div class="icon">🔗</div>

<h2>ورود به روم</h2>

<input
id="joinCode"
maxlength="6"
inputmode="numeric"
placeholder="کد ۶ رقمی">

<button onclick="joinRoom()">
🚪 ورود
</button>

<button class="secondary" onclick="home()">
↩️ برگشت
</button>

<div id="joinMessage"></div>

</div>


<!-- ROOM -->

<div class="card hidden" id="room">

<div class="icon">🃏</div>

<h2>روم شما</h2>

<div class="room-code" id="roomCode">
------
</div>

<button onclick="copyCode()">
📋 کپی کد
</button>

<button class="secondary" onclick="shareRoom()">
📤 دعوت دوستان
</button>

<h3>بازیکنان</h3>

<div id="players">
در حال بارگذاری...
</div>

<button class="secondary" onclick="home()">
↩️ خروج
</button>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://uhgikijqlirttwdykaah.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jgq1e7NvxiANV8pEyTYKlA_ZobviYyi";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   TELEGRAM
========================= */

const tg =
window.Telegram.WebApp;

tg.ready();
tg.expand();

const telegramUser =
tg.initDataUnsafe &&
tg.initDataUnsafe.user;

const telegramId =
telegramUser && telegramUser.id
? String(telegramUser.id)
: "guest-" + Date.now();

const username =
telegramUser && telegramUser.first_name
? telegramUser.first_name
: "Player";

document.getElementById("username")
.textContent=username;


/* =========================
   VARIABLES
========================= */

let currentRoom=null;
let currentRoomId=null;


/* =========================
   PAGE
========================= */

function hidePages(){

document.getElementById("home")
.classList.add("hidden");

document.getElementById("join")
.classList.add("hidden");

document.getElementById("room")
.classList.add("hidden");

}


function home(){

hidePages();

document.getElementById("home")
.classList.remove("hidden");

}


function showJoin(){

hidePages();

document.getElementById("join")
.classList.remove("hidden");

document.getElementById("joinCode")
.focus();

}


/* =========================
   CREATE ROOM
========================= */

async function createRoom(){

try{

const code =
Math.floor(
100000+
Math.random()*900000
).toString();


const result =
await db
.from("rooms")
.insert({
code:code,
status:"waiting"
})
.select()
.single();


if(result.error){

console.error(result.error);

alert(
"خطا در ساخت روم:\n\n"+
result.error.message
);

return;

}


currentRoom=code;

currentRoomId=result.data.id;


/* ADD HOST */

const player =
await db
.from("room_players")
.insert({
room_id:currentRoomId,
telegram_id:telegramId,
username:username,
seat:1,
ready:true
});


if(player.error){

alert(
"روم ساخته شد ولی بازیکن اضافه نشد:\n\n"+
player.error.message
);

return;

}


openRoom();

loadPlayers();


}catch(error){

console.error(error);

alert(
"خطای اتصال:\n\n"+
error.message
);

}

}


/* =========================
   OPEN ROOM
========================= */

function openRoom(){

hidePages();

document.getElementById("room")
.classList.remove("hidden");

document.getElementById("roomCode")
.textContent=currentRoom;

}


/* =========================
   JOIN ROOM
========================= */

async function joinRoom(){

const code =
document.getElementById("joinCode")
.value
.trim();


if(!/^\d{6}$/.test(code)){

document.getElementById("joinMessage")
.innerHTML=
"<div class='message'>❌ کد باید ۶ رقمی باشد.</div>";

return;

}


try{

const result =
await db
.from("rooms")
.select("*")
.eq("code",code)
.maybeSingle();


if(result.error){

showJoinError(result.error.message);

return;

}


if(!result.data){

showJoinError("روم پیدا نشد.");

return;

}


const room=result.data;


const playersResult =
await db
.from("room_players")
.select("*")
.eq("room_id",room.id);


if(playersResult.error){

showJoinError(
playersResult.error.message
);

return;

}


const players =
playersResult.data || [];


if(players.length>=4){

showJoinError(
"این روم پر است."
);

return;

}


const exists =
players.some(
p =>
String(p.telegram_id)===
String(telegramId)
);


if(!exists){

let seat=1;

const seats =
players.map(p=>p.seat);

while(seats.includes(seat)){
seat++;
}


const insert =
await db
.from("room_players")
.insert({
room_id:room.id,
telegram_id:telegramId,
username:username,
seat:seat,
ready:false
});


if(insert.error){

showJoinError(
insert.error.message
);

return;

}

}


currentRoom=code;

currentRoomId=room.id;

openRoom();

loadPlayers();


}catch(error){

showJoinError(
error.message
);

}

}


function showJoinError(message){

document.getElementById("joinMessage")
.innerHTML=
"<div class='message'>❌ "+
message+
"</div>";

}


/* =========================
   LOAD PLAYERS
========================= */

async function loadPlayers(){

if(!currentRoomId)return;


const result =
await db
.from("room_players")
.select("*")
.eq("room_id",currentRoomId)
.order("seat");


if(result.error){

document.getElementById("players")
.innerHTML=
"❌ "+result.error.message;

return;

}


let html="";


for(let i=1;i<=4;i++){

const player =
result.data.find(
p=>p.seat===i
);


if(player){

html+=
"<div class='player-slot'>"+
"👤 "+
escapeHtml(player.username||"Player")+
"<span style='float:left'>"+
(player.ready?"🟢 آماده":"🟡 منتظر")+
"</span>"+
"</div>";

}else{

html+=
"<div class='player-slot'>"+
"⭕ جایگاه "+i+
"<span style='float:left'>خالی</span>"+
"</div>";

}

}


document.getElementById("players")
.innerHTML=html;

}


/* =========================
   COPY
========================= */

async function copyCode(){

try{

await navigator.clipboard
.writeText(currentRoom);

alert("✅ کد کپی شد");

}catch{

alert(
"کد روم:\n"+
currentRoom
);

}

}


/* =========================
   SHARE
========================= */

function shareRoom(){

const text=
"🎮 بیا حکم بازی کنیم!\n"+
"🃏 کد روم: "+
currentRoom;


const url=
"https://t.me/share/url?url="+
encodeURIComponent(
"https://aliabbaszadeh0923-creator.github.io/Hokm_mini_app/"
)+
"&text="+
encodeURIComponent(text);


if(tg.openTelegramLink){

tg.openTelegramLink(url);

}else{

window.open(url,"_blank");

}

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
  </html>
