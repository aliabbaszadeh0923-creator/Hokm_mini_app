<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOKM</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg,#3b1747,#160d20,#09070d);
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .coins {
      background: rgba(255,255,255,.1);
      padding: 12px 18px;
      border-radius: 25px;
      font-size: 18px;
    }

    .player {
      text-align: center;
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: linear-gradient(135deg,#ff3bd4,#8b35ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      margin: auto;
    }

    .logo {
      text-align: center;
      margin: 60px 0 35px;
    }

    .logo h1 {
      font-size: 58px;
      margin: 0;
      letter-spacing: 5px;
      color: #e74cff;
    }

    .logo p {
      font-size: 18px;
      color: #ccc;
    }

    .card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 30px;
      padding: 30px 20px;
      text-align: center;
    }

    .card-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .card h2 {
      font-size: 25px;
    }

    .card p {
      color: #ccc;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 15px;
      border: 0;
      border-radius: 25px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg,#ff28cf,#8535ff);
      cursor: pointer;
    }

    button.secondary {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);
    }

    .room-box {
      display: none;
      margin-top: 20px;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 15px;
      border: 1px solid #555;
      background: #18131d;
      color: white;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255,255,255,.08);
      border-radius: 15px;
      display: none;
    }

    .footer {
      text-align: center;
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="coins">🪙 <span id="coins">0</span></div>

    <div class="player">
      <div class="avatar">♠</div>
      <b id="username">Player</b>
      <div style="color:#aaa;font-size:13px;">آماده بازی</div>
    </div>
  </div>

  <div class="logo">
    <h1>HOKM</h1>
    <p>Ultimate Card Game</p>
  </div>

  <div class="card">

    <div class="card-icon">🃏</div>

    <h2>آماده‌ای؟</h2>

    <p>
      وارد بازی حکم شو و با بازیکنان واقعی رقابت کن
    </p>

    <button onclick="startGame()">
      🎮 شروع بازی
    </button>

    <button class="secondary" onclick="createRoom()">
      👥 ساخت روم
    </button>

    <button class="secondary" onclick="showJoinRoom()">
      🔗 ورود به روم
    </button>

    <div id="roomBox" class="room-box">

      <input
        id="roomCode"
        placeholder="کد روم را وارد کنید"
        maxlength="6"
      >

      <button onclick="joinRoom()">
        🚪 ورود
      </button>

    </div>

    <div id="result" class="result"></div>

  </div>

  <div class="footer">
    HOKM • Telegram Mini App
  </div>

</div>

<script>

  /* =====================================
     SUPABASE
     ===================================== */

  const SUPABASE_URL = "https://uhgzikijqllrttwdykaah.supabase.co";

  const SUPABASE_KEY = "sb_publishable_jgq1e7NvxiANV8pEyTYKlA_ZobviYyi";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /* =====================================
     TELEGRAM
     ===================================== */

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  let telegramUser = tg.initDataUnsafe?.user;

  let telegramId =
    telegramUser?.id?.toString() ||
    "guest-" + Date.now();

  let username =
    telegramUser?.first_name ||
    "Player";

  document.getElementById("username").textContent = username;


  /* =====================================
     HELPERS
     ===================================== */

  function showResult(message) {

    const result = document.getElementById("result");

    result.style.display = "block";
    result.innerHTML = message;

  }


  /* =====================================
     START GAME
     ===================================== */

  function startGame() {

    showResult(
      "🎮 بازی آماده است!<br><br>" +
      "به‌زودی سیستم بازی آنلاین فعال می‌شود."
    );

  }


  /* =====================================
     CREATE ROOM
     ===================================== */

  async function createRoom() {

    showResult("⏳ در حال ساخت روم...");

    try {

      const code =
        Math.floor(100000 + Math.random() * 900000)
        .toString();

      const { data, error } =
        await supabaseClient
          .from("rooms")
          .insert({
            code: code,
            host_telegram_id: telegramId,
            status: "waiting"
          })
          .select()
          .single();

      if (error) {
        console.error(error);

        showResult(
          "❌ خطا در ساخت روم<br><br>" +
          error.message
        );

        return;
      }

      await supabaseClient
        .from("room_players")
        .insert({
          telegram_id: telegramId,
          username: username,
          seat: 1,
          ready: true
        });

      showResult(
        "🎉 روم ساخته شد!<br><br>" +
        "<b style='font-size:32px'>" +
        code +
        "</b><br><br>" +
        "این کد را به دوستت بده."
      );

    } catch (error) {

      console.error(error);

      showResult(
        "❌ خطای اتصال به سرور"
      );

    }

  }


  /* =====================================
     SHOW JOIN
     ===================================== */

  function showJoinRoom() {

    document.getElementById("roomBox").style.display =
      "block";

    document.getElementById("roomCode").focus();

  }


  /* =====================================
     JOIN ROOM
     ===================================== */

  async function joinRoom() {

    const code =
      document.getElementById("roomCode")
      .value
      .trim();

    if (!code) {

      showResult("⚠️ کد روم را وارد کن.");

      return;
    }


    showResult("⏳ در حال پیدا کردن روم...");


    try {

      const { data: room, error } =
        await supabaseClient
          .from("rooms")
          .select("*")
          .eq("code", code)
          .maybeSingle();


      if (error) {

        console.error(error);

        showResult(
          "❌ خطا در اتصال:<br>" +
          error.message
        );

        return;
      }


      if (!room) {

        showResult(
          "❌ این روم پیدا نشد."
        );

        return;
      }


      const { count } =
        await supabaseClient
          .from("room_players")
          .select("*", {
            count: "exact",
            head: true
          });


      const seat =
        (count || 0) + 1;


      const { error: playerError } =
        await supabaseClient
          .from("room_players")
          .insert({
            telegram_id: telegramId,
            username: username,
            seat: seat,
            ready: true
          });


      if (playerError) {

        showResult(
          "❌ خطا در ورود بازیکن:<br>" +
          playerError.message
        );

        return;
      }


      showResult(
        "✅ با موفقیت وارد روم شدی!<br><br>" +
        "کد روم: <b>" +
        code +
        "</b>"
      );


    } catch (error) {

      console.error(error);

      showResult(
        "❌ اتصال به سرور برقرار نشد."
      );

    }

  }

</script>

</body>
</html>
